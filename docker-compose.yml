services:
  db:
    image: postgres:17
    container_name: evibebook-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: evibebook
      POSTGRES_PASSWORD: evibebook
      POSTGRES_DB: evibebook
    ports:
      - '5433:5432'
    volumes:
      - evibebook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U evibebook -d evibebook']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  evibebook_pgdata:
